services:
  backend:
    build:
      context: ./jfcl-backend
      dockerfile: Dockerfile
    container_name: jfcl_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=${FRONTEND_URL}
      - COOKIE_SECURE=true
      - COOKIE_SAME_SITE=lax
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    networks:
      - jfcl_network

  frontend:
    build:
      context: ./jfcl-frontend
      dockerfile: Dockerfile
    container_name: jfcl_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - jfcl_network

networks:
  jfcl_network:
    driver: bridge
