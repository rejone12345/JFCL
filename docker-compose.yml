services:
  backend:
    build:
      context: ./jfcl-backend
      dockerfile: Dockerfile
    container_name: jfcl_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=${FRONTEND_URL}
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
    networks:
      - jfcl_network

  frontend:
    build:
      context: ./jfcl-frontend
      dockerfile: Dockerfile
    container_name: jfcl_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jfcl_network

networks:
  jfcl_network:
    driver: bridge
